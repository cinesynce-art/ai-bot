<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Assistant App</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      font-family: sans-serif;
      color: #ffffff;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }
    .header {
      padding: 14px 16px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .status {
      font-size: 11px;
      color: #4caf50;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4caf50;
      border-radius: 50%;
      display: inline-block;
    }
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #121212;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .message.bot {
      background-color: #2a2a2a;
      color: #ffffff;
      align-self: flex-start;
    }
    .message.user {
      background-color: #c8a2c8;
      color: #000000;
      align-self: flex-end;
    }
    .input-bar {
      padding: 12px;
      background-color: #1e1e1e;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 8px;
    }
    .input-bar input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background-color: #2a2a2a;
      color: #ffffff;
      outline: none;
      font-size: 14px;
    }
    .input-bar button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background-color: #c8a2c8;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h2>AI Assistant</h2>
      <span class="status"><span class="status-dot"></span> ONLINE</span>
    </div>

    <div id="chatMessages" class="chat-messages">
      <div class="message bot">Hello! I am your Worldwide AI Assistant. How can I assist you today?</div>
    </div>

    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const apiKey = "AQ.Ab8RN6JtIJjftbMSo7l8yLrbiTfvb5w5XrHvaUilMwfRnKP9gw";
    
    const inputElement = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const messagesContainer = document.getElementById("chatMessages");

    async function sendMessage() {
      const text = inputElement.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputElement.value = "";
      scrollToBottom();

      const loadingId = appendMessage("Thinking...", 'bot');
      scrollToBottom();

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
          }
        );

        const data = await response.json();
        const loadingElement = document.getElementById(loadingId);

        if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
          loadingElement.innerHTML = formatText(data.candidates[0].content.parts[0].text);
        } else if (data.error) {
          loadingElement.textContent = `API Error: ${data.error.message}`;
        } else {
          loadingElement.textContent = "Response error. Please check your key settings.";
        }
      } catch (error) {
        const loadingElement = document.getElementById(loadingId);
        loadingElement.textContent = `Network Error: ${error.message}`;
      }

      scrollToBottom();
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement("div");
      const msgId = 'msg-' + Date.now();
      msgDiv.id = msgId;
      msgDiv.className = `message ${sender}`;
      msgDiv.textContent = text;
      messagesContainer.appendChild(msgDiv);
      return msgId;
    }

    function formatText(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    sendBtn.addEventListener("click", sendMessage);
    inputElement.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
